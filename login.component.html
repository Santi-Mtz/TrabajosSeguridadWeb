<p-card styleClass="card" [style]="{ width: '50%', overflow: 'hidden' }">
  <ng-template #header>
    <img alt="Card" style="width: 100%; height: 350px; object-fit: cover;" src="https://primefaces.org/cdn/primeng/images/card-ng.jpg" />
  </ng-template>
  <ng-template #title>
    <div class="login-title">Login</div>
  </ng-template>
  <ng-template #subtitle>
    <div class="login-subtitle">Inicio de sesión</div>
  </ng-template>

  <div class="content-wrap">
    <p-inputgroup>
      <p-inputgroup-addon>
        <i class="pi pi-envelope"></i>
      </p-inputgroup-addon>
      <input pInputText [(ngModel)]="email" placeholder="Correo electrónico" autocomplete="off" />
    </p-inputgroup>

    <p-password styleClass="password-field" [(ngModel)]="passwordValue" [toggleMask]="true" />

    <small class="hint">Credenciales de prueba: admin@seguridadweb.com / Admin@12345</small>

    <div class="submit-action">
      <p-button label="Entrar" [disabled]="!canSubmit" (onClick)="onLogin()" />
    </div>

    <small *ngIf="loginError" class="error-msg">{{ loginError }}</small>
    <small *ngIf="loginSuccess" class="success-msg">{{ loginSuccess }}</small>
  </div>


  <ng-template #footer>
    <div class="actions secondary-actions">
      <p-button label="Volver a landing" severity="secondary" routerLink="/landing" />
      <p-button label="Crear cuenta" severity="contrast" routerLink="/register" />
    </div>
  </ng-template>
</p-card>
