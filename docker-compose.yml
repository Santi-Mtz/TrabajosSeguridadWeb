services:
  postgres:
    image: postgres:17-alpine
    container_name: erpjir-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: seguridad_web
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./schema_supabase.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
      - ./data_supabase.sql:/docker-entrypoint-initdb.d/02_data.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d seguridad_web"]
      interval: 10s
      timeout: 5s
      retries: 10

  user-service:
    build:
      context: ./backend/user-service
      dockerfile: Dockerfile
    container_name: erpjir-user-service
    environment:
      PORT: 3001
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/seguridad_web
      DATABASE_SSL: "false"
      JWT_SECRET: dev-secret-change-me
    ports:
      - "3001:3001"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3001/health >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  group-service:
    build:
      context: ./backend/group-service
      dockerfile: Dockerfile
    container_name: erpjir-group-service
    environment:
      PORT: 3003
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/seguridad_web
      DATABASE_SSL: "false"
      JWT_SECRET: dev-secret-change-me
    ports:
      - "3003:3003"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3003/health >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  ticket-service:
    build:
      context: ./backend/ticket-service
      dockerfile: Dockerfile
    container_name: erpjir-ticket-service
    environment:
      TICKET_SERVICE_PORT: 3002
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/seguridad_web
      DATABASE_SSL: "false"
      JWT_SECRET: dev-secret-change-me
    ports:
      - "3002:3002"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3002/health >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  api-gateway:
    build:
      context: ./backend/api-gateway
      dockerfile: Dockerfile
    container_name: erpjir-api-gateway
    environment:
      PORT: 3000
      USER_SERVICE_URL: http://user-service:3001
      GROUP_SERVICE_URL: http://group-service:3003
      TICKET_SERVICE_URL: http://ticket-service:3002
      JWT_SECRET: dev-secret-change-me
      RATE_LIMIT_MAX: 100
      RATE_LIMIT_WINDOW: 1 minute
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/seguridad_web
      DATABASE_SSL: "false"
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      user-service:
        condition: service_healthy
      group-service:
        condition: service_healthy
      ticket-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/health >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: erpjir-frontend
    ports:
      - "8080:80"
    depends_on:
      api-gateway:
        condition: service_healthy

volumes:
  postgres_data:
