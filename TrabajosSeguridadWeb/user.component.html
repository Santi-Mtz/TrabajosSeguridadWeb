<section class="user-page">
  <h1>User</h1>
  @if (notification) {
    <p-message [severity]="notification.severity" [text]="notification.text" />
  }

  <section class="crud-grid">
    <p-card header="CRUD User">
      <div class="form-grid">
        <input pInputText [(ngModel)]="form.name" placeholder="Name" />
        <input pInputText [(ngModel)]="form.email" placeholder="Email" />
        <input pInputText [(ngModel)]="form.role" placeholder="Role" />
        <input pInputText [(ngModel)]="form.team" placeholder="Team" />
      </div>

      <div class="actions-row">
        <p-button [label]="editingId !== null ? 'Actualizar' : 'Crear'" (onClick)="saveUser()" />
        <p-button label="Limpiar" severity="secondary" (onClick)="resetForm()" />
      </div>
    </p-card>

    <p-card header="Lista de usuarios">
      <div class="list-grid">
        @for (user of users; track user.id) {
          <div class="list-item">
            <div><strong>ID:</strong> {{ user.id }}</div>
            <div><strong>Name:</strong> {{ user.name }}</div>
            <div><strong>Email:</strong> {{ user.email }}</div>
            <div><strong>Role:</strong> {{ user.role }}</div>
            <div><strong>Team:</strong> {{ user.team }}</div>

            <div class="actions-row">
              <p-button label="Editar" severity="secondary" (onClick)="editUser(user)" />
              <p-button label="Eliminar" severity="danger" (onClick)="deleteUser(user.id)" />
            </div>
          </div>
        } @empty {
          <p>No hay usuarios registrados.</p>
        }
      </div>
    </p-card>
  </section>
</section>
