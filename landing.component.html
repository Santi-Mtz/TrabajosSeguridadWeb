<p-card styleClass="landing-card" [style]="{ width: '50%', overflow: 'hidden' }">
  <ng-template #header>
    <img alt="Card" style="width: 100%; height: 350px; object-fit: cover;" src="https://primefaces.org/cdn/primeng/images/card-ng.jpg" />
  </ng-template>
  <ng-template #title>
    <div class="landing-title">Landing</div>
  </ng-template>
  <ng-template #subtitle>
    <div class="landing-subtitle">Bienvenido</div>
  </ng-template>

  <p class="landing-text">LANDING PAGE</p>

  <ng-template #footer>
    <div class="actions">
      <p-button label="Iniciar sesión" routerLink="/login" />
      <p-button label="Crear cuenta" severity="secondary" routerLink="/register" />
    </div>
  </ng-template>
</p-card>
